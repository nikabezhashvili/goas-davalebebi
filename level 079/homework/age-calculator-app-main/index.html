                    <input type="number" placeholder="YYYY" id="y">
                </div>
            </div>
            <div id="row">
                <img src="./images/icon-arrow.svg" onclick="count_age()">
            </div>
        </div>
        <div id="res">
            <div>
                <i id="year">--</i>
                <i>years</i>
            </div>
            <div>
                <i id="mon">--</i>
                <i>months</i>
            </div>
            <div>
                <i id="day">--</i>
                <i>days</i>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
